<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Image Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Logan's Morning Routine</h1>
	
	<div class="main-layout-container">
		<div class="button-column">
			<button id="GetDressedButton">Get dressed</button>	
		
			<button id="PackBackpackButton">Pack Backpack</button>
		
			<button id="EatBreakfastButton">Eat Breakfast</button>
			
			<button id="EatVitaminsButton">Eat Vitamins</button>
			
			<button id="BrushTeethButton">Brush Teeth</button>
			
			<button id="WallSitButton">Do Wall Sit</button>
			
			<button id="PlankButton">Do Plank</button>
			
			<button id="SocksButton">Put On Socks</button>
			
			<button id="ShoesButton">Put On Shoes</button>
			
			<button id="MedicineButton">Take Medicine</button>
		</div>
		
		<div class="image-area">
			<img id="funImage" src="placeholder.jpg" alt="A fun image">	
		</div>
		
	</div>
